name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create waitlist config from secret
        env:
          NFORMS_ACCESS_KEY: ${{ secrets.NFORMS_ACCESS_KEY }}
        run: |
          if [ -z "$NFORMS_ACCESS_KEY" ]; then
            echo "::error::NFORMS_ACCESS_KEY secret is not set on the github-pages environment."
            exit 1
          fi
          cat > code/waitlist.config.js <<EOF
          window.ARCHMATTER_WAITLIST = {
            enabled: true,
            endpoint: 'https://api.nforms.eu/f/${NFORMS_ACCESS_KEY}',
          };
          EOF

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: code

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
