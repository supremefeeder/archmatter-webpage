<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

:root {
  --bg:           #fafaf8;
  --ink:          #0f0f0e;
  --muted:        #5a5a56;
  --faint:        #9c9c96;
  --line:         rgba(15, 15, 14, 0.08);
  --line-strong:  rgba(15, 15, 14, 0.18);

  --f-sans:       'Switzer', system-ui, -apple-system, sans-serif;

  --fs-h1:        clamp(2.125rem, 3.2vw + 1.125rem, 3.625rem);
  --fs-lead:      clamp(1rem, 0.3vw + 0.95rem, 1.125rem);
  --fs-body:      0.9375rem;
  --fs-micro:     0.75rem;

  --page-pad:     clamp(24px, 5vw, 56px);
  --content-max:  640px;
  --hero-max:     860px;

  --ease:         cubic-bezier(0.22, 1, 0.36, 1);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-sans);
  font-size: var(--fs-body);
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

::selection {
  background: rgba(15, 15, 14, 0.12);
  color: var(--ink);
}

:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}

/* ── Nav ─────────────────────────────────────── */

.site-nav {
  width: 100%;
  padding: 0 var(--page-pad);
}

.site-nav-inner {
  max-width: var(--hero-max);
  margin: 0 auto;
  padding: 24px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-logo {
  font-size: 0.9375rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--ink);
  text-decoration: none;
}

.nav-meta {
  font-size: var(--fs-micro);
  color: var(--muted);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}

/* ── Hero ────────────────────────────────────── */

main {
  flex: 1;
  display: flex;
  align-items: center;
  padding: clamp(48px, 8vh, 96px) var(--page-pad);
}

.hero {
  width: 100%;
  max-width: var(--hero-max);
  margin: 0 auto;
  opacity: 0;
  animation: fade-in 600ms 100ms var(--ease) forwards;
}

@keyframes fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

.hero h1 {
  font-size: var(--fs-h1);
  font-weight: 500;
  line-height: 1.08;
  letter-spacing: -0.03em;
  margin: 0 0 36px;
  text-wrap: balance;
}

.hero-lead {
  font-size: var(--fs-lead);
  font-weight: 400;
  line-height: 1.55;
  color: var(--muted);
  max-width: 32em;
  margin: 0 0 52px;
  letter-spacing: -0.005em;
  text-wrap: pretty;
}

/* ── Form ────────────────────────────────────── */

.wl-form {
  position: relative;
  display: flex;
  gap: 8px;
  max-width: 460px;
  margin: 0 0 14px;
}

.wl-honeypot {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.wl-input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 100px;
  padding: 13px 20px;
  font-family: inherit;
  font-size: var(--fs-body);
  font-weight: 400;
  color: var(--ink);
  outline: none;
  transition: border-color 200ms var(--ease);
}
.wl-input::placeholder { color: var(--faint); }
.wl-input:hover  { border-color: rgba(15, 15, 14, 0.3); }
.wl-input:focus  { border-color: var(--ink); }

.wl-btn {
  background: var(--ink);
  color: var(--bg);
  border: 1px solid var(--ink);
  border-radius: 100px;
  padding: 13px 22px;
  font-family: inherit;
  font-size: var(--fs-body);
  font-weight: 500;
  letter-spacing: -0.005em;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 200ms var(--ease), color 200ms var(--ease);
}
.wl-btn:hover { background: transparent; color: var(--ink); }
.wl-btn:disabled { opacity: 0.55; cursor: wait; }

.wl-note {
  font-size: var(--fs-micro);
  color: var(--faint);
  margin: 0;
  letter-spacing: 0.005em;
}
.wl-note.is-error { color: #9b3a3a; }
.wl-note.is-success { color: var(--muted); }

/* ── Footer ──────────────────────────────────── */

/* ── Mobile ──────────────────────────────────── */

@media (max-width: 560px) {
  .hero h1 { line-height: 1.05; }

  .wl-form {
    flex-direction: column;
    gap: 10px;
    max-width: 100%;
  }
  .wl-input,
  .wl-btn {
    width: 100%;
    padding: 15px 22px;
  }
  .wl-btn { font-size: var(--fs-body); }
}
</style>
</head>
<body>

<nav class="site-nav" aria-label="Main">
  <div class="site-nav-inner">
    <a class="nav-logo" href="/">archmatter</a>
    <span class="nav-meta">Early access</span>
  </div>
</nav>

<main>
  <div class="hero">
    <h1>Between the idea and the line</h1>
    <p class="hero-lead">
      A BIM tool for architects that works like sketching. Geometry first, parameters later. From first line to finished drawings.
    </p>

    <form class="wl-form" id="wlForm" novalidate>
      <label class="wl-honeypot" aria-hidden="true">
        Leave blank
        <input type="text" name="botcheck" tabindex="-1" autocomplete="off">
      </label>
      <input
        class="wl-input"
        type="email"
        name="email"
        id="wlEmail"
        placeholder="you@studio.com"
        autocomplete="email"
        required
      >
      <button type="submit" class="wl-btn" id="wlBtn">Keep me posted</button>
    </form>
    <p class="wl-note" id="wlMsg" role="status" aria-live="polite">No spam.</p>
  </div>
</main>

<script src="waitlist.config.js"></script>
<script>
(function () {
  const waitlistCfg = window.ARCHMATTER_WAITLIST || {};
  const form = document.getElementById('wlForm');
  const email = document.getElementById('wlEmail');
  const btn = document.getElementById('wlBtn');
  const msg = document.getElementById('wlMsg');
  const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const btnLabel = btn.textContent;

  const accessKey = waitlistCfg.accessKey
    || (waitlistCfg.endpoint && waitlistCfg.endpoint.split('/f/')[1]);
  if (accessKey) form.setAttribute('data-nforms-key', accessKey);

  function setMsg(text, tone) {
    msg.textContent = text;
    msg.classList.remove('is-error', 'is-success');
    if (tone === 'err') msg.classList.add('is-error');
    if (tone === 'ok') msg.classList.add('is-success');
  }

  async function signup() {
    const value = email.value.trim();
    if (!re.test(value)) {
      setMsg('Please enter a valid email address.', 'err');
      email.focus();
      return;
    }

    if (!waitlistCfg.enabled || !waitlistCfg.endpoint) {
      setMsg('Sign-up isn\u2019t available yet. Please try again later.', 'err');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending\u2026';
    setMsg('Sending\u2026', null);

    const payload = new FormData(form);
    payload.set('email', value);
    payload.set('_subject', 'Archmatter waitlist');
    if (accessKey) payload.set('access_key', accessKey);

    try {
      const res = await fetch(waitlistCfg.endpoint, {
        method: 'POST',
        body: payload,
        headers: { Accept: 'application/json' },
      });

      if (res.ok) {
        setMsg('Thanks \u2014 we\u2019ll be in touch.', 'ok');
        form.reset();
        return;
      }

      if (res.status === 429) {
        setMsg('Too many attempts. Please try again later.', 'err');
        return;
      }

      setMsg('Something went wrong. Please try again.', 'err');
    } catch {
      setMsg('Could not connect. Check your network and try again.', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = btnLabel;
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    signup();
  });
})();
</script>
</body>
